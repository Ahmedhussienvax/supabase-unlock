name: Publish to Image Registry

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    # زودنا الوقت عشان بناء ARM على سيرفر مجاني بياخد وقت أطول شوية
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          # ده هيخليه يترفع على حسابك اوتوماتيك (ghcr.io/Ahmedhussienvax/supabase-unlock)
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{date 'YYYY.MM.DD'}}-,enable=true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Multi-Arch Docker Image
        id: build
        uses: docker/build-push-action@v3
        with:
          push: true
          context: .
          file: apps/studio/Dockerfile
          target: production
          # هنا السحر: بيبني النسختين مع بعض في Image واحدة!
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
